plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.multiframeprocessor'
version = '1.0.0'

android {
  namespace 'expo.modules.multiframeprocessor'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
